name: Build Sophisticated Backpack Inventory Switch Patch

on:
  workflow_dispatch:
    inputs:
      jar_filename:
        description: Optional release asset jar file name. Leave empty to use the automatic naming format.
        required: false
        default: ''
      release_name:
        description: GitHub Release name
        required: true
        default: Sophisticated Backpack Inventory Switch Patch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sophisticated-backpack-inventory-switch
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: sophisticated-backpack-inventory-switch/**/*.gradle*
      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          jar_filename='${{ inputs.jar_filename }}'
          if [[ -z "$jar_filename" ]]; then
            jar_filename='[精妙背包切换]sophisticated-backpack-inventory-switch-forge-0.${{ github.run_number }}.jar'
          fi
          if [[ "$jar_filename" != *.jar || "$jar_filename" == */* || "$jar_filename" == *\\* ]]; then
            echo "jar_filename must be a plain .jar file name without path separators" >&2
            exit 1
          fi
          mod_version="$(printf '%s' "$jar_filename" | sed -n 's/.*-forge-\(.*\)\.jar$/\1/p')"
          if [[ -z "$mod_version" ]]; then
            echo "Cannot infer mod version from jar_filename: $jar_filename" >&2
            exit 1
          fi
          sed -i "s/^mod_version=.*/mod_version=$mod_version/" gradle.properties
          printf '%s\n' "$jar_filename" > ../release-jar-name.txt
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon
      - name: Prepare release jar
        shell: bash
        run: |
          set -euo pipefail
          jar_filename="$(cat ../release-jar-name.txt)"
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [[ "${#jars[@]}" -eq 0 ]]; then
            echo "No built jar found in build/libs" >&2
            exit 1
          fi
          mkdir -p ../release
          cp "${jars[0]}" "../release/$jar_filename"
      - uses: actions/upload-artifact@v4
        with:
          name: sophisticated-backpack-inventory-switch
          path: release/*.jar
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sophisticated-backpack-inventory-switch-${{ github.run_number }}
          name: ${{ inputs.release_name }}
          body: |
            Automated build of `sophisticated-backpack-inventory-switch` from `${{ github.sha }}`.
          files: release/*.jar
