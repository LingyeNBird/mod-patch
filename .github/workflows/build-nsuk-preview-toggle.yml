name: Build NSUK Preview Toggle Patch

on:
  workflow_dispatch:
    inputs:
      jar_filename:
        description: Release asset jar file name, for example nsuk-preview-toggle-patch.jar
        required: true
        default: nsuk-preview-toggle-patch.jar
      release_name:
        description: GitHub Release name
        required: true
        default: NSUK Preview Toggle Patch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PATCH_DIR: nsuk-preview-toggle-patch
    defaults:
      run:
        working-directory: nsuk-preview-toggle-patch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: nsuk-preview-toggle-patch/**/*.gradle*
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon
      - name: Prepare release jar
        shell: bash
        run: |
          set -euo pipefail
          jar_filename='${{ inputs.jar_filename }}'
          if [[ "$jar_filename" != *.jar || "$jar_filename" == */* || "$jar_filename" == *\\* ]]; then
            echo "jar_filename must be a plain .jar file name without path separators" >&2
            exit 1
          fi
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [[ "${#jars[@]}" -eq 0 ]]; then
            echo "No built jar found in build/libs" >&2
            exit 1
          fi
          mkdir -p ../release
          cp "${jars[0]}" "../release/$jar_filename"
      - uses: actions/upload-artifact@v4
        with:
          name: nsuk-preview-toggle-patch
          path: release/*.jar
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nsuk-preview-toggle-patch-${{ github.run_number }}
          name: ${{ inputs.release_name }}
          body: |
            Automated build of `nsuk-preview-toggle-patch` from `${{ github.sha }}`.

            Download the built jar from the release assets below.
          files: release/*.jar
